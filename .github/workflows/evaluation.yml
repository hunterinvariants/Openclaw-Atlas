name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff format --check src tests
      - run: python -m ruff check src tests
      - run: python -m mypy src/openclaw_atlas
      - run: python -m pytest --cov --cov-report=term-missing --cov-fail-under=85
      - run: python -m build
      - run: atlas run datasets/milestone-1.jsonl --evidence-dir evidence/ci
      - run: atlas replay datasets/milestone-1.jsonl evidence/ci/traces/timeout-recovery.json
      - run: atlas compare evidence/latest/report.json evidence/ci/report.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: atlas-evidence
          path: evidence/ci
