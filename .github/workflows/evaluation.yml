name: deterministic-evaluation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest --cov --cov-report=term-missing --cov-fail-under=85
      - run: atlas run datasets/milestone-1.jsonl --evidence-dir evidence/ci
      - run: python -m openclaw_atlas.regression evidence/latest/report.json evidence/ci/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-evidence
          path: evidence/ci

